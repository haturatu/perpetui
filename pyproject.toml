[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "perpetui"
version = "0.1.0"
description = "A terminal dashboard for MEXC, Hyperliquid and Lighter charts and open positions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=6.0,<9",
  "httpx>=0.28,<1",
  "pycryptodome>=3.20,<5",
  "websockets>=15,<18",
  "plotext>=6.1,<7",
]

[project.scripts]
perpetui = "perpetui.cli:main"
mexc-tui = "perpetui.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
